# H2
spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:h2:mem:authdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    hibernate:
#      ddl-auto: create-drop
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    open-in-view: false

logging:
  level:
    com.server.smzshop: DEBUG
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: trace

#JWT
jwt :
  secret-key: mySecretKeyForJwtToken123456789!@#$%^&*()
  access-token-expire-time: 1800000   # 30분 (ms)
  refresh-token-expire-time: 604800000  # 7일 (ms)

server:
  port: 8080